tags:
  - Contacts
summary: Update contact by id
operationId: patchContact
description: 'Update contact by its id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '67f4feaec0e11fb79d796537'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Wick'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+354475555'
          email:
            description: "Contact's email"
            type: string
            example: 'example@abc.com'
          isFavourite:
            description: 'Whether a contact is favourite'
            type: boolean
            example: false
          contactType:
            description: "Contact's relation"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
